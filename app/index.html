<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WaveGen3D</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <strong>WaveGen3D</strong>
          <span>Static speaker wave CAD prototype</span>
        </div>
        <div class="actions">
          <label class="file-button">
            Load JSON
            <input id="load-project" type="file" accept=".json,.wavecad.json">
          </label>
          <button id="save-json" type="button">Save JSON</button>
          <button id="export-obj" type="button">OBJ</button>
          <button id="export-stl" type="button">STL</button>
          <button id="save-png" type="button">PNG</button>
        </div>
      </header>

      <section class="workspace">
        <section class="viewer-wrap">
          <div id="viewer"></div>
          <div class="hud">
            <span>Orbit</span>
            <span>Pan</span>
            <span>Zoom</span>
            <span id="mesh-stats">Ready</span>
          </div>
        </section>

        <aside class="controls">
          <section class="panel">
            <h2>Project</h2>
            <label>Project name <input id="project-name" type="text"></label>
          </section>

          <section class="panel">
            <h2>Cabinet</h2>
            <div class="grid-2">
              <label>Width <input data-path="cabinet.dimensions.width" type="number" step="1"></label>
              <label>Height <input data-path="cabinet.dimensions.height" type="number" step="1"></label>
              <label>Depth <input data-path="cabinet.dimensions.depth" type="number" step="1"></label>
              <label>Wall <input data-path="cabinet.dimensions.wallThickness" type="number" step="1"></label>
            </div>
          </section>

          <section class="panel">
            <h2>Wave Relief</h2>
            <div class="grid-2">
              <label>Relief depth <input data-path="waves.reliefDepth" type="number" step="0.1"></label>
              <label>Base amp <input data-path="waves.baseAmplitude" type="number" step="0.1"></label>
              <label>Bias <input data-path="waves.reliefBias" type="number" step="0.1"></label>
              <label>Min wall <input data-path="waves.minThickness" type="number" step="0.5"></label>
            </div>
            <label>Normalization
              <select data-path="waves.normalization">
                <option value="softClip">Soft clip</option>
                <option value="clamp">Clamp</option>
                <option value="none">None</option>
              </select>
            </label>
            <label>Resolution
              <select data-path="preview.resolution">
                <option value="draft">Draft</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="ultra">Ultra</option>
              </select>
            </label>
          </section>

          <section class="panel">
            <div class="section-row">
              <h2>Drivers & Sources</h2>
              <div class="button-row">
                <button id="add-driver" type="button">Add Driver</button>
                <button id="add-source" type="button">Add Point</button>
              </div>
            </div>
            <div id="sources"></div>
          </section>

          <section class="panel">
            <h2>Overlays</h2>
            <label class="check"><input data-path="preview.showSeams" type="checkbox"> Seams</label>
            <label class="check"><input data-path="preview.showDrivers" type="checkbox"> Driver rings</label>
            <label class="check"><input data-path="preview.showSources" type="checkbox"> Source points</label>
            <label class="check"><input data-path="preview.showPanels" type="checkbox"> Surface wire</label>
          </section>

          <section class="panel note">
            <h2>STEP</h2>
            <p>STEP export is intentionally separate from this static prototype. Use JSON/OBJ/STL now; a Docker STEP exporter is planned.</p>
          </section>
        </aside>
      </section>
    </main>

    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="geometry.js"></script>
    <script src="exporters.js"></script>
    <script src="app.js"></script>
  </body>
</html>
