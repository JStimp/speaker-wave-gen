<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WaveGen3D</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <strong>WaveGen3D</strong>
          <span>Static speaker wave CAD prototype</span>
        </div>
        <div class="actions">
          <label class="file-button" data-tip="Load a saved WaveGen3D project JSON into the current editor.">
            Load JSON
            <input id="load-project" type="file" accept=".json,.wavecad.json">
          </label>
          <button id="export-step" class="primary" type="button" data-tip="Download the current cabinet as a Smooth surface STEP by default. Use the faceted fallback only if a CAD import needs it.">Export STEP</button>
          <button id="save-json" type="button" data-tip="Save the editable WaveGen3D project file.">Save Project</button>
          <button id="export-obj" class="secondary" type="button" data-tip="Download a mesh OBJ for reference or non-CAD workflows.">OBJ</button>
          <button id="export-stl" class="secondary" type="button" data-tip="Download a mesh STL for quick checks or slicer-style tools.">STL</button>
          <button id="save-png" class="secondary" type="button" data-tip="Save the current viewport as a PNG screenshot.">PNG</button>
          <button id="prepare-solid-step" class="secondary" type="button" data-tip="Save JSON for the separate Docker CAD-kernel exporter experiment.">Docker JSON</button>
        </div>
      </header>

      <section class="workspace">
        <section class="viewer-wrap">
          <div id="viewer"></div>
          <div class="hud">
            <span>Orbit</span>
            <span>Pan</span>
            <span>Zoom</span>
            <button id="reset-view" type="button">Reset View</button>
            <span id="mesh-stats">Ready</span>
          </div>
        </section>

        <aside class="controls">
          <section class="panel">
            <h2>Project</h2>
            <label data-tip="Names the project and exported files.">Project name <input id="project-name" type="text"></label>
            <label data-tip="Converts cabinet, source, relief, and export values between inches and millimeters.">Units
              <select id="unit-select">
                <option value="in">Inches</option>
                <option value="mm">Millimeters</option>
              </select>
            </label>
          </section>

          <section class="panel">
            <h2>Cabinet</h2>
            <div class="grid-2">
              <label data-tip="Overall cabinet width along the red X direction. The floor stays centered on X=0."><span><span class="axis-dot axis-x"></span>Width X</span><input data-path="cabinet.dimensions.width" data-dimension="x" type="number" step="0.125"></label>
              <label data-tip="Overall cabinet depth along the green Y direction. Positive Y is the driver/front side."><span><span class="axis-dot axis-y"></span>Depth Y</span><input data-path="cabinet.dimensions.depth" data-dimension="y" type="number" step="0.125"></label>
              <label data-tip="Overall cabinet height along the blue Z direction. The bottom contact plane remains Z=0."><span><span class="axis-dot axis-z"></span>Height Z</span><input data-path="cabinet.dimensions.height" data-dimension="z" type="number" step="0.125"></label>
              <label data-tip="Nominal material thickness used to limit the maximum relief depth.">Wall <input data-path="cabinet.dimensions.wallThickness" type="number" step="0.0625"></label>
            </div>
            <label data-tip="Rounds the cabinet edges before waves are applied so the relief wraps more smoothly around corners.">Corner wrap <input data-path="cabinet.cornerWrap" type="range" min="0" max="1" step="0.01"></label>
          </section>

          <section class="panel">
            <h2>Wave Relief</h2>
            <div class="grid-2">
              <label data-tip="Maximum allowed wave height before wall-thickness limits are applied.">Relief depth <input data-path="waves.reliefDepth" type="number" step="0.01"></label>
              <label data-tip="Global multiplier for all enabled driver and point-source waves.">Base amp <input data-path="waves.baseAmplitude" type="number" step="0.1"></label>
              <label data-tip="Offsets the wave field outward or inward before clipping. Usually keep near zero.">Bias <input data-path="waves.reliefBias" type="number" step="0.01"></label>
              <label data-tip="Minimum material that should remain after carving relief.">Min wall <input data-path="waves.minThickness" type="number" step="0.01"></label>
            </div>
            <label class="check" data-tip="Keeps the underside contact patch flat on Z=0 while the lower perimeter curls inward/upward."><input data-path="waves.flatBottom" type="checkbox"> Flat bottom</label>
            <label data-tip="Controls how waves are limited when they exceed the relief depth. Soft clip usually looks most natural.">Normalization
              <select data-path="waves.normalization">
                <option value="softClip">Soft clip</option>
                <option value="clamp">Clamp</option>
                <option value="none">None</option>
              </select>
            </label>
            <label data-tip="Changes live viewport mesh density. Higher settings show smoother waves but rebuild more slowly.">Preview detail
              <select data-path="preview.resolution">
                <option value="draft">Draft</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="ultra">Ultra</option>
                <option value="inspection">Inspection</option>
              </select>
            </label>
          </section>

          <section class="panel">
            <div class="section-row">
              <h2>Drivers & Sources</h2>
              <div class="button-row">
                <button id="add-driver" type="button" data-tip="Add a front-panel driver with a matching wave source and cutout ring.">Add Driver</button>
                <button id="add-source" type="button" data-tip="Add a manual wave source without a driver ring.">Add Point</button>
              </div>
            </div>
            <div id="source-list" class="source-list"></div>
            <div id="source-editor" class="source-editor"></div>
          </section>

          <section class="panel">
            <h2>View Tools</h2>
            <label data-tip="Changes how relief height is colored in the viewport. This does not affect exports.">Surface color
              <select data-path="preview.colorMode">
                <option value="relief">Relief contrast</option>
                <option value="wood">Wood relief</option>
                <option value="mono">Solid shaded</option>
              </select>
            </label>
            <label data-tip="Visual-only contrast for the relief colors. Higher values make small height changes easier to read.">Color contrast <input data-path="preview.heightContrast" type="number" step="0.1" min="0.5" max="4"></label>
            <label class="check" data-tip="Shows the original unwarped cabinet bounds."><input data-path="preview.showOutline" type="checkbox"> Outline box</label>
            <label class="check" data-tip="Shows a small floor origin marker plus an offset XYZ direction triad."><input data-path="preview.showAxes" type="checkbox"> XYZ origin</label>
            <label class="check" data-tip="Shows slim CAD-style dimension lines outside the cabinet."><input data-path="preview.showDimensions" type="checkbox"> Dimension guides</label>
            <label class="check" data-tip="Shows transparent min/max relief planes for checking deviation."><input data-path="preview.showAnalysis" type="checkbox"> Analysis planes</label>
            <label class="check" data-tip="Shows the Z=0 floor reference grid."><input data-path="preview.showGrid" type="checkbox"> Floor grid</label>
            <label class="check" data-tip="Shows the rectangular panel boundary reference lines."><input data-path="preview.showSeams" type="checkbox"> Seams</label>
            <label class="check" data-tip="Shows driver cutout/reference rings on the front face."><input data-path="preview.showDrivers" type="checkbox"> Driver rings</label>
            <label class="check" data-tip="Shows clickable wave source markers."><input data-path="preview.showSources" type="checkbox"> Source points</label>
            <label class="check" data-tip="Shows the preview triangle wire overlay. Useful for mesh density checks, visually noisy for design work."><input data-path="preview.showPanels" type="checkbox"> Surface wire</label>
            <div id="analysis-stats" class="analysis-stats"></div>
          </section>

          <section class="panel">
            <h2>Output</h2>
            <label data-tip="Controls mesh density for OBJ/STL and source sampling for browser STEP. Higher quality improves detail and can slow SolidWorks imports.">Export quality
              <select data-path="export.resolution">
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="ultra">Ultra</option>
                <option value="inspection">Inspection</option>
                <option value="fine">Fine</option>
                <option value="production">Production</option>
              </select>
            </label>
            <label data-tip="Smooth surface STEP is the production-direction output with spline faces and fewer CAD entities. Faceted solid fallback is useful when you need SolidWorks to force a solid body.">STEP type
              <select data-path="export.stepMode">
                <option value="smoothSurfaceStep">Smooth surface STEP</option>
                <option value="facetedSolidStep">Faceted solid fallback</option>
              </select>
            </label>
            <label data-tip="Controls Smooth surface STEP quality. Higher values fit each cabinet face with more spline control points; this can improve fidelity but may reduce import reliability.">Spline controls <input data-path="export.surfaceControlLimit" type="number" min="10" max="64" step="1"></label>
            <p id="export-status" class="status-text">Exports use the selected output quality, independent of preview resolution.</p>
          </section>
        </aside>
      </section>
    </main>

    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="geometry.js"></script>
    <script src="exporters.js"></script>
    <script src="app.js"></script>
  </body>
</html>
