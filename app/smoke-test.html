<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>WaveGen3D Smoke Test</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 32px; }
      .pass { color: #1f7a3f; }
      .fail { color: #a32020; }
    </style>
  </head>
  <body>
    <h1>WaveGen3D Smoke Test</h1>
    <pre id="results"></pre>
    <script src="geometry.js"></script>
    <script src="exporters.js"></script>
    <script>
      (function () {
        const lines = [];
        let failed = false;

        function check(label, condition) {
          if (!condition) failed = true;
          lines.push((condition ? "PASS " : "FAIL ") + label);
        }

        const project = WaveGeometry.createDefaultProject();
        const mesh = WaveGeometry.generatePreviewMesh(project, { resolution: "draft" });
        const exportMesh = WaveGeometry.generatePreviewMesh(project, { resolution: "high" });
        const dims = project.cabinet.dimensions;
        const front = WaveGeometry.pointOnFace("front", 1, 0.42, dims, project);
        const right = WaveGeometry.pointOnFace("right", 0, 0.42, dims, project);
        const frontFloor = WaveGeometry.pointOnFace("front", 0.37, 0, dims, project);
        const bottomFront = WaveGeometry.pointOnFace("bottom", 0.37, 0, dims, project);
        const bottom = WaveGeometry.pointOnFace("bottom", 0.37, 0.62, dims, project);
        const top = WaveGeometry.pointOnFace("top", 0.37, 0.62, dims, project);
        const topBorder = WaveGeometry.pointOnFace("top", 0.02, 0.5, dims, project);
        const topBlendMid = WaveGeometry.pointOnFace("top", (project.waves.topFlatBorder + project.waves.topWaveBlend / 2) / dims.width, 0.5, dims, project);
        const back = WaveGeometry.pointOnFace("back", 0.41, 0.58, dims, project);
        const lowerCapSeam = WaveGeometry.pointOnFace("front", 0.5, dims.wallThickness / dims.height, dims, project);
        const upperCapSeam = WaveGeometry.pointOnFace("front", 0.5, 1 - dims.wallThickness / dims.height, dims, project);
        const frontHeight = WaveGeometry.computeWaveDisplacement(front, project).displacement;
        const rightHeight = WaveGeometry.computeWaveDisplacement(right, project).displacement;
        const bottomHeight = WaveGeometry.computeWaveDisplacement(bottom, project).displacement;
        const topHeight = WaveGeometry.computeWaveDisplacement(top, project).displacement;
        const topBorderHeight = WaveGeometry.computeWaveDisplacement(topBorder, project).displacement;
        const topBlendMidHeight = WaveGeometry.computeWaveDisplacement(topBlendMid, project).displacement;
        const unmaskedTopProject = WaveGeometry.createDefaultProject();
        unmaskedTopProject.waves.topFlatBorder = 0;
        unmaskedTopProject.waves.topWaveBlend = 0;
        const unmaskedTopBlendMidHeight = WaveGeometry.computeWaveDisplacement(topBlendMid, unmaskedTopProject).displacement;
        const oversizedBorderProject = WaveGeometry.createDefaultProject();
        oversizedBorderProject.waves.topFlatBorder = 100000;
        oversizedBorderProject.waves.topWaveBlend = 100000;
        const oversizedBorderHeight = WaveGeometry.computeWaveDisplacement(top, oversizedBorderProject).displacement;
        const migratedProject = WaveGeometry.normalizeProject({ waves: { surfaceMode: "fourWallFlatCaps" } });
        const backHeight = WaveGeometry.computeWaveDisplacement(back, project).displacement;
        const lowerCapSeamHeight = WaveGeometry.computeWaveDisplacement(lowerCapSeam, project).displacement;
        const upperCapSeamHeight = WaveGeometry.computeWaveDisplacement(upperCapSeam, project).displacement;
        const minZ = Math.min.apply(null, mesh.vertices.filter((value, index) => index % 3 === 2));
        const halfDepth = dims.depth / 2;

        check("default units are inches", project.units === "in");
        check("default project loads", project.project.name.length > 0);
        check("default surface mode uses four walls and an inset waved top", project.waves.surfaceMode === "fourWallsInsetTop");
        check("legacy flat-cap projects migrate to inset top mode", migratedProject.waves.surfaceMode === "fourWallsInsetTop");
        check("default browser STEP mode is smooth surface", project.export.stepMode === "smoothSurfaceStep");
        check("default panel visualization is assembled model", project.preview.panelMode === "model");
        check("default zoom origin is screen center", project.preview.zoomOrigin === "center");
        check("all DFM panels are visible by default", project.preview.visiblePanels.length === 6);
        check("all DFM panels are selected by default", project.panelization.dfm.exportPanels.length === 6);
        check("mesh has finite vertices", mesh.vertices.length > 0 && mesh.vertices.every(Number.isFinite));
        check("mesh summary includes relief deviation", mesh.summary.deviation > 0 && mesh.summary.maxAbsHeight > 0);
        check("default export mesh is production-preview dense", exportMesh.summary.triangleCount > mesh.summary.triangleCount);
        check("front/right seam heights match", Math.abs(frontHeight - rightHeight) < 1e-9);
        check("lower wall stays square at the flat cap", Math.abs(frontFloor.position.y - halfDepth) < 1e-12 && Math.abs(frontFloor.position.z) < 1e-12);
        check("front/bottom floor edge positions match", Math.abs(frontFloor.position.x - bottomFront.position.x) < 1e-12 && Math.abs(frontFloor.position.y - bottomFront.position.y) < 1e-12 && Math.abs(frontFloor.position.z - bottomFront.position.z) < 1e-12);
        check("flat bottom cap has zero wave displacement", Math.abs(bottomHeight) < 1e-12);
        check("top interior receives wave displacement", Math.abs(topHeight) > 1e-5);
        check("top perimeter stays flat", Math.abs(topBorderHeight) < 1e-12);
        check("top wave blend fades smoothly", Math.abs(topBlendMidHeight) > 1e-5 && Math.abs(topBlendMidHeight) < Math.abs(unmaskedTopBlendMidHeight));
        check("oversized top border clamps to a finite flat top", Number.isFinite(oversizedBorderHeight) && Math.abs(oversizedBorderHeight) < 1e-12);
        check("wall relief fades to zero at both cap seams", Math.abs(lowerCapSeamHeight) < 1e-12 && Math.abs(upperCapSeamHeight) < 1e-12);
        check("top and bottom nominal cap planes stay fixed", Math.abs(bottom.position.z) < 1e-12 && Math.abs(top.position.z - dims.height) < 1e-12);
        check("bottom surface remains at Z0", Math.abs(minZ) < 1e-12);
        check("back face still receives waves", Math.abs(backHeight) > 1e-5);
        check("OBJ exporter returns text", WaveExporters.meshToObj(exportMesh, "test").length > 100);
        check("STL exporter returns text", WaveExporters.meshToStl(exportMesh, "test").length > 100);
        const panelSet = WaveGeometry.generateDfmPanelMeshes(project, { resolution: "draft" });
        const panelPlan = WaveGeometry.dfmPanelPlan(project);
        const jointReport = WaveGeometry.dfmJointReport(project);
        const maxCurvedEdges = Math.max.apply(null, panelSet.panels.map((panel) => panel.ownedEdges.length));
        const panelBottomsFlat = panelSet.panels.every((panel) => panel.bottomGrid.every((row) => row.every((point) => Math.abs(point.z) < 1e-12)));
        const bottomPanelMesh = panelSet.panels.find((panel) => panel.face === "bottom");
        const topPanelMesh = panelSet.panels.find((panel) => panel.face === "top");
        const bottomPanelPlanar = bottomPanelMesh.heights.every((height) => Math.abs(height) < 1e-12);
        const topPerimeterHeights = topPanelMesh.heights.filter((height, index) => {
          const row = Math.floor(index / (topPanelMesh.columns + 1));
          const column = index % (topPanelMesh.columns + 1);
          return row === 0 || row === topPanelMesh.rows || column === 0 || column === topPanelMesh.columns;
        });
        const topPanelHasInsetWaves = topPanelMesh.heights.some((height) => Math.abs(height) > 1e-5) && topPerimeterHeights.every((height) => Math.abs(height) < 1e-12);
        const wallCapSeamsStraight = panelSet.panels.filter((panel) => panel.face !== "top" && panel.face !== "bottom").every((panel) => {
          const rowSize = panel.columns + 1;
          return panel.heights.slice(0, rowSize).concat(panel.heights.slice(-rowSize)).every((height) => Math.abs(height) < 1e-12);
        });
        const wavePanelCount = panelSet.panels.filter((panel) => panel.isWavePanel).length;
        const frontPanel = panelPlan.panels.find((panel) => panel.face === "front");
        const rightPanel = panelPlan.panels.find((panel) => panel.face === "right");
        const topPanel = panelPlan.panels.find((panel) => panel.face === "top");
        const wallThickness = project.cabinet.dimensions.wallThickness;
        const dfmStep = WaveExporters.panelSetToStep(panelSet, project, "test");
        const dfmBodyCount = (dfmStep.match(/MANIFOLD_SOLID_BREP/g) || []).length;
        const dfmPlaneCount = (dfmStep.match(/PLANE\('/g) || []).length;
        const frontStep = WaveExporters.panelSetToStep({
          units: panelSet.units,
          panels: [panelSet.panels[0]]
        }, project, "test-front");
        const frontBodyCount = (frontStep.match(/MANIFOLD_SOLID_BREP/g) || []).length;
        check("DFM panel export creates six panels", panelSet.panels.length === 6);
        check("DFM panels keep two or fewer curved edges each", maxCurvedEdges <= 2);
        check("DFM output has five wave panels", wavePanelCount === 5);
        check("DFM top has inset waves with a flat perimeter", topPanelHasInsetWaves);
        check("DFM bottom panel remains fully planar", bottomPanelPlanar);
        check("DFM wall roundovers and relief end at straight cap seams", wallCapSeamsStraight);
        check("DFM front wall fits between flat caps", Math.abs(frontPanel.width - project.cabinet.dimensions.width) < 1e-12 && Math.abs(frontPanel.height - (project.cabinet.dimensions.height - 2 * wallThickness)) < 1e-12);
        check("DFM side wall fits between caps and front/back owners", Math.abs(rightPanel.width - (project.cabinet.dimensions.depth - 2 * wallThickness)) < 1e-12 && Math.abs(rightPanel.height - (project.cabinet.dimensions.height - 2 * wallThickness)) < 1e-12);
        check("DFM flat cap keeps full width and depth", Math.abs(topPanel.width - project.cabinet.dimensions.width) < 1e-12 && Math.abs(topPanel.height - project.cabinet.dimensions.depth) < 1e-12);
        check("all twelve DFM joints have exactly one edge owner", jointReport.jointCount === 12 && jointReport.joints.every((joint) => joint.validOwnership));
        check("DFM panel solids have zero corner-volume overlap", jointReport.overlapCount === 0 && jointReport.maxOverlap < 1e-12);
        check("DFM square mating planes match owner inner faces", jointReport.valid && jointReport.maxPlaneError < 1e-12);
        check("DFM panel undersides stay flat", panelBottomsFlat);
        check("DFM OBJ exporter returns panel text", WaveExporters.panelSetToObj(panelSet, "test").includes("routed_curved_edges"));
        check("DFM STL exporter returns panel solids", WaveExporters.panelSetToStl(panelSet, "test").includes("front_panel"));
        check("DFM STEP exporter returns six panel solids with five spline wave faces", dfmBodyCount === 6 && (dfmStep.match(/B_SPLINE_SURFACE_WITH_KNOTS/g) || []).length === 5);
        check("DFM STEP boundaries and bottom cap are analytic planes", dfmPlaneCount === 31);
        check("individual DFM STEP contains one named solid", frontBodyCount === 1 && frontStep.includes("Front panel DFM solid"));
        const step = WaveExporters.meshToStep(mesh, project, "test");
        check("STEP exporter returns smooth solid BREP with an analytic bottom plane", step.includes("MANIFOLD_SOLID_BREP") && step.includes("CLOSED_SHELL") && step.includes("B_SPLINE_SURFACE_WITH_KNOTS") && (step.match(/PLANE\('/g) || []).length === 1);

        const results = document.getElementById("results");
        results.textContent = lines.join("\n");
        results.className = failed ? "fail" : "pass";
        document.title = failed ? "Smoke Test Failed" : "Smoke Test Passed";
      }());
    </script>
  </body>
</html>
