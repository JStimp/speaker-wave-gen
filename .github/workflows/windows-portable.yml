name: Windows Portable Bundle

on:
  workflow_dispatch:

jobs:
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable Windows bundle
        shell: pwsh
        run: ./scripts/build-portable-windows.ps1
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: WaveGen3D-windows-portable
          path: dist/WaveGen3D-windows-portable.zip
          if-no-files-found: error
