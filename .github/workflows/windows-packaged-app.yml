name: Windows Packaged App

on:
  workflow_dispatch:
  push:
    branches: [experimental]
    paths:
      - "apps/**"
      - "packages/**"
      - "exporter/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/windows-packaged-app.yml"

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Package portable Windows app
        run: npm run package:win
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: WaveGen3D-windows-portable-exe
          path: apps/desktop/dist-packaged/*.exe
          if-no-files-found: error
