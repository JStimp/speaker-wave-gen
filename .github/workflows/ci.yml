name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]

jobs:
  core-and-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm test

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm --workspace @speaker-wave-gen/desktop run build

  docker-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f exporter/Dockerfile -t speaker-wave-exporter .
      - run: docker run --rm -v "${{ github.workspace }}:/work" speaker-wave-exporter --config /work/examples/default-speaker.wavecad.json --out /work/exports --format all --panel-mode separated
      - run: test -f exports/export_report.json

