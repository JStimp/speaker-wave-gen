name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]

jobs:
  static-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static app files
        run: |
          test -f Launch-WaveGen3D.bat
          test -f Export-Solid-Step.bat
          test -f app/index.html
          test -f app/app.js
          test -f app/geometry.js
          test -f app/exporters.js
          test -f app/vendor/three.min.js
          test -f app/vendor/OrbitControls.js
          test -f app/smoke-test.html
          test -f solid-step-exporter/Dockerfile
          test -f solid-step-exporter/wavegen_solid_exporter/geometry.py
          test -f solid-step-exporter/wavegen_solid_exporter/ocp_export.py
      - name: Verify solid exporter geometry without Docker
        run: |
          python -m py_compile $(find solid-step-exporter -name '*.py')
          python solid-step-exporter/tests/test_geometry.py
      - name: Verify dependency-free prototype
        run: |
          test ! -f package.json
          test ! -d apps
          test ! -d packages
          test ! -d node_modules
          test ! -f package-lock.json
      - name: Check no active npm/Electron launch path
        run: |
          ! grep -R "npm install\|electron \.|vite --host" Launch-WaveGen3D.bat app README.md docs examples
